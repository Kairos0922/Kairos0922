<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The reactor that won't turn cold</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.rx {
  --rx-ember: #ff7a2a;
  --rx-ember-deep: #c2571f;
  --rx-water-tint: #3d6b8c;
  --rx-cut: #161616;
  --rx-blend: screen;
  --rx-hot-ink: #b0562a;
}

[data-theme="light"] .rx {
  --rx-ember: #c2410c;
  --rx-ember-deep: #9a3412;
  --rx-water-tint: #7fa8c2;
  --rx-cut: #b8b5ae;
  --rx-blend: normal;
  --rx-hot-ink: #c2410c;
}

/* the cutaway cavity: darker, warmer steel (a physical ground for the glow) */
.rx-cavity {
  --anatomy-paper: #1d1a17;
  --anatomy-face: #232019;
  --anatomy-top: #24211a;
  --anatomy-shade-0: #171512;
  --anatomy-shade-1: #1a1815;
  --anatomy-shade-2: #1d1b17;
  --anatomy-shade-3: #201e19;
}
[data-theme="light"] .rx-cavity {
  --anatomy-paper: #b3aca0;
  --anatomy-face: #beb7ab;
  --anatomy-top: #c4bdb1;
  --anatomy-shade-0: #8f897d;
  --anatomy-shade-1: #9c968a;
  --anatomy-shade-2: #a8a294;
  --anatomy-shade-3: #b5afa3;
}

/* fuel assemblies take the ember tint, driven live by --rx-heat */
.rx-asm .iso-top {
  fill: color-mix(in oklab, var(--anatomy-top), var(--rx-ember) calc(var(--rx-heat, 1) * 42%));
}
.rx-asm .iso-shade[data-shade="2"],
.rx-asm .iso-shade[data-shade="3"] {
  fill: color-mix(in oklab, var(--anatomy-shade-2), var(--rx-ember) calc(var(--rx-heat, 1) * 30%));
}

/* water: a quiet blue tint on the cavity backdrop and the sight glass */
.rx-water {
  fill: var(--rx-water-tint);
  opacity: 0.30;
  pointer-events: none;
}
[data-theme="light"] .rx-water {
  opacity: 0.42;
  mix-blend-mode: multiply;
}

.rx-cutface {
  fill: var(--rx-cut);
}

/* the hot leg warms with the coolant temperature */
.rx [data-piece="loop"] .tb-body { fill: var(--anatomy-shade-2); }

.rx-stage {
  position: relative;
  border-radius: 10px;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.rx-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}
.rx-stage > svg,
.rx-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}
.rx-front,
.rx-gl {
  position: absolute;
  inset: 0;
  height: 100% !important;
}
.rx-gl {
  pointer-events: none;
  mix-blend-mode: var(--rx-blend);
}
.rx-front {
  pointer-events: none;
  overflow: visible;
}
.rx-front .it {
  pointer-events: visiblePainted;
}

/* selection */
.rx-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}
.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}
.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}
.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

/* bar meters */
.rx-slot {
  fill: none;
  stroke: var(--anatomy-mid);
  stroke-width: 0.6;
}
.rx-barfill {
  fill: var(--rx-ember);
  opacity: 0.85;
}
.rx [data-bar="fission"] {
  fill: var(--anatomy-lit);
}

/* time slider */
.rx-slider {
  position: absolute;
  left: 20px;
  bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--anatomy-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}
.rx-slider input[type="range"] {
  width: 190px;
  height: 22px;
  accent-color: var(--anatomy-lit);
  cursor: ew-resize;
}
.rx-slider-label {
  white-space: nowrap;
}

/* model & assumptions: keyboard-reachable <details>, both themes via tokens */
.rx-notes {
  color: var(--anatomy-muted);
  font-size: 13px;
}
.rx-notes summary {
  cursor: pointer;
  width: fit-content;
  color: var(--anatomy-text);
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.rx-notes summary:hover { color: var(--anatomy-strong); }
.rx-notes summary:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}
.rx-notes-body {
  display: grid;
  gap: 8px;
  max-width: 74ch;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--anatomy-shade-0);
}
.rx-notes-body p { margin: 0; }
.rx-notes-body dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 8px 18px;
  margin: 0;
}
.rx-notes-body dt {
  padding-top: 1px;
  color: var(--anatomy-text);
  font-family: var(--anatomy-mono);
  font-size: 11px;
}
.rx-notes-body dd { margin: 0; }

@media (max-width: 640px) {
  .rx .iso-plate {
    padding: 48px 8px 84px;
  }
  .rx-notes-body dl {
    grid-template-columns: 1fr;
    gap: 2px;
  }
  .rx-notes-body dt { margin-top: 6px; }
  .rx-slider {
    left: 14px;
    right: 14px;
    bottom: 12px;
  }
  .rx-slider input[type="range"] {
    width: 100%;
    flex: 1;
  }
  .rx .iso-plate-corner[data-corner="readout"] {
    bottom: 44px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
}

ider aria-label="Time after scram, in seconds"/></label></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><i data-mark="lit"></i>control rods and needles, driven by the model</span><span class="iso-key"><i data-mark="red"></i>core heat — relative glow intensity: fission at power, decay heat after SCRAM (orange)</span><span class="iso-key"><i data-mark="blue"></i>primary coolant (blue)</span></span><span class="iso-caption">A pressurised-water reactor at 3,400 MW thermal (representative teaching setting). SCRAM drops the rods and the self-sustaining chain reaction is suppressed within seconds — a small residual fission term keeps a fraction of a percent alive. What cannot be switched off is decay heat from the fission products already made: about 6.6 % of full power at once, still 2.9 % (≈99 MW) a minute later, on top of a few tenths of a percent of residual fission. The pumps keep circulating; on a stylised teaching curve the temperature drifts down toward ≈292 °C and stays hot — that is the trend inside this 60 s window, not a prediction of the plant's hours-long transition to hot standby: real temperature response depends on the unit, its heat-removal capability and operating conditions. Teaching illustration with labelled approximations — not an accident-analysis or operations tool. Details under “Model & assumptions” below.</span><details class="rx-notes"><summary>Model &amp; assumptions</summary><div class="rx-notes-body"><p><strong>Scope.</strong> This figure is a teaching illustration of why decay heat matters. It is not a plant simulator, not an accident-analysis program, and not an operator aid: do not use it for real-plant accident prediction, operational decisions or safety analysis. Real plants are analysed with licensed codes (RELAP5, TRACE) on plant-specific data.</p><p>Every moving number is a pure function of one variable: t, the seconds since the operator pressed SCRAM (t = 0 is full power). P₀ = 3,400 MW thermal is a representative large four-loop PWR — a teaching setting, not a specific unit. Powers are shares of P₀ or MW; temperatures in °C; pressure in bar absolute.</p><dl><dt>Decay heat — Way–Wigner teaching rule</dt><dd>P/P₀ = 0.066 · t<sup>−0.2</sup>, t in seconds, held at 6.6 % below 1 s (the truncation avoids the power law's divergence as t → 0). Assumes the core ran at full power long before the scram — an irradiation history far longer than this 60 s window. Reference values: ≈6.6 % of full power at 1 s; ≈2.9 % (≈99 MW) at 60 s. This power law is the classic teaching approximation — it is <em>not</em> an implementation of the ANSI/ANS-5.1 standard, which sums many nuclide groups and reads slightly higher at short times. Source (bibliography checked online): K. Way &amp; E. P. Wigner, “The Rate of Decay of Fission Products”, Phys. Rev. 73, 1318–1330 (1948), <a href="https://doi.org/10.1103/PhysRev.73.1318">doi:10.1103/PhysRev.73.1318</a>.</dd><dt>Residual fission term</dt><dd>Rods free-fall for 2.4 s (real PWR scram rods: roughly 2–4 s). While they fall, prompt power is drawn down as (1 − rod travel)⁴ — a spatial-worth shape, not point kinetics. After insertion, fission does not drop to zero: a residual term ≈0.006 · (1+t)<sup>−0.2</sup> of P₀ remains. It is a phenomenological teaching placeholder, chosen so that a fraction of a percent of fission survives the rods — it is not a value computed from delayed-neutron kinetics. Real kinetics would track precursor concentrations, the decay constants of the delayed-neutron groups and reactivity changes (the point-kinetics equations); this figure implements none of them. Total heat power = residual fission + decay heat; the readout shows both separately.</dd><dt>Loop average temperature — stylised</dt><dd>T<sub>avg</sub>(t) = 291.5 + 17 · e<sup>−t/25</sup> °C. A stylised teaching response: the full-power average (308.5 °C) relaxing toward a representative ≈291.5 °C figure. The 291.5 °C figure, the 17 °C span and the 25 s time constant are teaching choices — not universal real-PWR parameters — standing in for loop inertia and steam-generator heat transfer. The curve shows a trend inside this 60 s window only: the model does not simulate or predict the plant's transition to and hold at hot standby, nor its temperature hours later — that depends on the specific unit, its heat-removal capability and operating conditions. Not a prediction of any plant's temperatures.</dd><dt>Core outlet temperature</dt><dd>Targets T<sub>avg</sub> + 16.5 °C × (total heat power)/P₀ through a 4 s transport lag. Assumes constant primary mass flow (pumps at full flow), constant coolant specific heat, and core ΔT proportional to power — teaching proportionality only. Values are computed by fixed-step integration from t = 0, so a reading depends only on the time t, never on how the slider was moved.</dd><dt>Fuel heat state</dt><dd>No fuel temperature is computed or displayed. A rough sensible-heat estimate from assumed values: ≈100 t UO₂ × ~0.3 J/(g·K) × ~390 K ≈ 12 GJ, about 3.4 s of rated thermal power — an order-of-magnitude figure for how much heat the fuel stores, not a validated fuel-temperature model, and not a claim that all of that heat leaves the fuel within the first tens of seconds: this figure has no coupled fuel–clad–coolant heat-transfer model and cannot compute how much stored heat is actually removed inside the 60 s window. Pellet interiors run far hotter than any average. The orange glow is a relative heat-intensity cue driven by the remaining heat power — it is not a calculated temperature field.</dd><dt>Pressure &amp; sight glass</dt><dd>Pressure is a fixed nominal 155 bar (absolute), schematic: no pressurizer dynamics (shrink/swell, heaters, spray) are modelled. The steam-generator sight-glass level is a fixed schematic: feedwater, boiling and secondary level control are not modelled, and no level change is implied.</dd><dt>Not modelled</dt><dd>Real coolant flow rates and loop transport, the pressurizer, secondary-side steam pressure and feedwater, spatial power and fuel temperature distributions, fission-product nuclide composition, and everything after t = 60 s: decay heat keeps falling for days, spent fuel needs years of cooling, and the plant's longer-term states (hot standby, cooldown) are outside this figure's scope.</dd><dt>References</dt><dd>K. Way &amp; E. P. Wigner, “The Rate of Decay of Fission Products”, Phys. Rev. 73, 1318–1330 (1948), <a href="https://doi.org/10.1103/PhysRev.73.1318">doi:10.1103/PhysRev.73.1318</a> (bibliography verified online via Crossref). ANSI/ANS-5.1-2014 (R2023), “Decay Heat Power in Light Water Reactors”, American Nuclear Society — the standard used in real analyses; its version and title are per the official ANSI webstore catalogue. This figure uses the Way–Wigner teaching power law and does not implement the standard's decay-heat method; citing the standard here implies no conformance testing or validation. For the point-kinetics equations this figure does not implement (precursor concentrations, group decay constants, reactivity), see e.g. Argonne National Laboratory's exposition: <a href="https://publications.anl.gov/anlpubs/2021/05/166771.pdf">publications.anl.gov/anlpubs/2021/05/166771.pdf</a>. Nuclear-regulator material (e.g. the US NRC's reactor-concept resources) covers decay heat in operational terms.</dd></dl></div></details></figcaption></figure></main><script type="module">const AZIMUTH = 45;

  if (phase === "rods inserting") {
    return `t ${t.toFixed(1)} s · fission ${fis.toFixed(1)} % · decay ${(dec * 100).toFixed(1)} % · total ${(tot * 100).toFixed(1)} % · outlet ${out} °C`;
  }
  const decMw = Math.round(dec * P0_MW);
  const totMw = Math.round(tot * P0_MW);
  return `t ${t.toFixed(1)} s · fission ${fis.toFixed(2)} % · decay ${(dec * 100).toFixed(1)} % (${decMw} MW) · total ${totMw.toLocaleString("en-US")} MW · outlet ${out} °C`;
}


const stage = document.querySelector(".rx-stage");
const back = stage.querySelector(".rx-back");
const front = stage.querySelector(".rx-front");
const canvas = stage.querySelector(".rx-gl");
const readout = document.querySelector("[data-readout]");
const slider = document.querySelector("[data-slider]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LIGHT = document.body.dataset.theme === "light" ? 1 : 0;
const PROJ = D.proj;
const NEEDLES = D.needles;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ---------------------------------------------------------------- shader
const FRAGMENT = `
uniform float uHeat;
uniform float uFirst;
uniform float uLight;
uniform vec2 uAsm[9];
const vec2 AXIS = vec2(${D.axis[0].toFixed(1)}, ${D.axis[1].toFixed(1)});
const float ROUT = ${D.rOut.toFixed(1)};
const float RIN = ${D.rIn.toFixed(1)};
const float RBAR = ${D.rBar.toFixed(1)};
const float RCORE = ${D.rCore.toFixed(1)};
const float WINZ0 = ${D.winZ[0].toFixed(1)};
const float WINZ1 = ${D.winZ[1].toFixed(1)};
const float WINB = ${D.winB.toFixed(2)};
const float PLATEZ = ${D.plateZ.toFixed(1)};
const float ASMZ0 = ${D.asmZ[0].toFixed(1)};
const float ASMZ1 = ${D.asmZ[1].toFixed(1)};
const float ASMH = ${D.asmHalf.toFixed(1)};
vec2 cylHit(vec2 o, vec2 d, float R) {
  float a = dot(d, d);
  float b = dot(o, d);
  float c = dot(o, o) - R * R;
  float disc = b * b - a * c;
  if (disc < 0.0) return vec2(1e9, -1e9);
  float sq = sqrt(disc);
  return vec2((-b - sq) / a, (-b + sq) / a);
}
vec3 rampOf(float e) {
  vec3 tint = vec3(1.0, 0.86, 0.76);
  vec3 body = vec3(0.94, 0.40, 0.07);
  vec3 rim = vec3(1.0, 0.58, 0.16);
  vec3 core = vec3(1.0, 0.86, 0.62);
  vec3 col = mix(vec3(1.0), tint, smoothstep(0.0, 0.12, e));
  col = mix(col, body, smoothstep(0.12, 0.5, e));
  col = mix(col, rim, smoothstep(0.42, 0.66, e));
  col = mix(col, core, smoothstep(0.62, 0.92, e));
  return col;
}
vec4 inkFor(vec3 seen, float cover) {
  vec3 absorbed = 1.0 - seen;
  float a = max(max(absorbed.r, max(absorbed.g, absorbed.b)), cover);
  return vec4(vec3(a) - absorbed, a);
}
void main() {
  vec2 vb = viewOf(gl_FragCoord.xy);
  vec3 g0 = rayOf(vb);
  vec3 V = towardViewer();
  float px = pixelOf();
  float pxz = px / uCam.w;
  vec2 o = g0.xy - AXIS;
  vec2 h46 = cylHit(o, V.xy, ROUT);
  float tN = h46.y;
  float zN = g0.z + tN * V.z;
  float bOff = abs(o.x * V.y - o.y * V.x) / uCam.w;
  float mask = (1.0 - smoothstep(WINB - 0.9 * px, WINB + 0.9 * px, bOff)) * window(zN, WINZ0 + 0.5, WINZ1 - 0.5, 1.1 * pxz);
  vec3 col = vec3(0.0);
  float lin = 0.0;
  if (mask > 0.001 && tN < 1e8) {
    vec2 h41 = cylHit(o, V.xy, RIN);
    vec2 h36 = cylHit(o, V.xy, RBAR);
    vec2 h30 = cylHit(o, V.xy, RCORE);
    float tW = h41.x;
    float tB = h36.x;
    float tPlate = (PLATEZ - g0.z) / V.z;
    vec3 pPlate = g0 + tPlate * V;
    bool plateOk = tPlate < tN && tPlate > tW && length(pPlate.xy - AXIS) < 40.0 && tPlate > 0.0;
    float tFirst = plateOk ? tPlate : max(tB, tW);
    float fl = 0.82 + 0.36 * fbm3(vec3(g0.xy * 0.028, uTime * 0.55));
    float ember = 0.0;
    for (int i = 0; i < 9; i++) {
      vec2 c = uAsm[i];
      vec2 d2 = o - (c - AXIS);
      vec2 inv = 1.0 / V.xy;
      vec2 tA = (-ASMH - d2) * inv;
      vec2 tB = (ASMH - d2) * inv;
      vec2 tlo = min(tA, tB);
      vec2 thi = max(tA, tB);
      float tmin = max(max(tlo.x, tlo.y), (ASMZ0 - g0.z) / V.z);
      float tmax = min(min(thi.x, thi.y), (ASMZ1 - g0.z) / V.z);
      if (tmax > tmin) {
        float chord = min(tmax, tN) - max(tmin, tFirst);
        if (chord > 0.0) {
          float w = chord / (2.0 * ASMH);
          float f = 0.75 + 0.5 * fbm3(vec3(c * 0.11, uTime * 0.5 + float(i) * 1.71));
          ember += w * f;
        }
      }
    }
    float water = 0.0;
    float c30 = 0.0;
    if (h30.y > h30.x) {
      c30 = min(h30.y, tN) - max(h30.x, tFirst);
      if (c30 > 0.0) water += c30 * 0.055;
    }
    if (h36.y > h36.x) {
      float c36 = min(h36.y, tN) - max(h36.x, tFirst);
      if (c36 > 0.0) water += max(c36 - max(c30, 0.0), 0.0) * 0.02;
    // bias the water glow toward the core's mid height so it hugs the fuel
    vec3 pMid = g0 + V * clamp(dot(vec3(AXIS, 87.0) - g0, V) / dot(V, V), tFirst, tN);
    water *= 0.35 + 0.65 * exp(-pow((pMid.z - 87.0) / 34.0, 2.0));
    }
    float surf = 0.0;
    vec3 pFirst = g0 + tFirst * V;
    float zFirst = pFirst.z;
    if (tFirst > -1e8) {
      if (plateOk) surf = 1.1;
      else if (zFirst > WINZ0 - 4.0 && zFirst < WINZ1 + 4.0) surf = 0.85 * window(zFirst, WINZ0, WINZ1, 3.0);
    }
    lin = ember * 0.30 + water * 0.14 + surf * 0.32;
    lin *= fl;
  }
  float bright = 0.10 + 0.90 * pow(clamp(uHeat, 0.0, 1.0), 0.45);
  float e = (1.0 - exp(-2.2 * lin * bright)) * mask;
  vec3 seen = rampOf(e);
  float wash = 0.55 * smoothstep(0.5, 0.9, e);
  vec4 ink = inkFor(seen, wash);
  ink.rgb *= ink.a;
  ink *= uFirst;
  vec3 add = tonemap(vec3(1.0, 0.42, 0.12) * lin * bright * 1.35 + vec3(1.0, 0.72, 0.4) * pow(lin * bright, 2.2) * 0.9, 1.1) * mask * uFirst;
  float mAdd = max(add.r, max(add.g, add.b));
  vec4 dark = vec4(add, mAdd);
  float m = max(ink.r, max(ink.g, ink.b));
  float n = (hash12(gl_FragCoord.xy + fract(uTime * 0.61) * 91.0) + hash12(gl_FragCoord.yx * 1.37 + fract(uTime * 0.37) * 57.0) - 1.0) / 255.0;
  ink = max(ink + vec4(n * smoothstep(0.0, 1.5 / 255.0, m)), vec4(0.0));
  dark = max(dark + vec4(n * smoothstep(0.0, 1.5 / 255.0, mAdd)), vec4(0.0));
  gl_FragColor = mix(dark, ink, uLight);
}`;

const layer = glLayer({
  canvas,
  fragment: FRAGMENT,
  view: [D.W, D.H],
  camera: D.camera,
  uniforms: ["uHeat", "uFirst"],
  fixed: { uLight: LIGHT, uAsm: new Float32Array(D.asm.flat()) },
});
if (layer) stage.setAttribute("data-gl", "");

// ---------------------------------------------------------------- refs
const rodsEl = document.getElementById("rx-rods");
const cursorEl = stage.querySelector('[data-live="cursor-item"]');
const scramEl = stage.querySelector('[data-live="scram"]');
const needleEls = {
  power: stage.querySelector('[data-live="needle-power"]'),
  temp: stage.querySelector('[data-live="needle-temp"]'),
};
const barEls = {
  fission: stage.querySelector('[data-bar="fission"]'),
  decay: stage.querySelector('[data-bar="decay"]'),
};
const BAR_Z = [14, 34];
const needleAt = (key, value) => {
  const n = NEEDLES[key];
  const share = clamp((value - n.lo) / (n.hi - n.lo), 0, 1);
  const angle = ((n.from + n.span * share) * Math.PI) / 180;
  return lineOnTop([n.x - Math.sin(angle) * 3.2, n.y + Math.cos(angle) * 3.2], [n.x + Math.sin(angle) * (n.r - 3.6), n.y - Math.cos(angle) * (n.r - 3.6)], n.top + 0.2, PROJ);
};

// ---------------------------------------------------------------- state
let t = 0;
let playing = false;
let scramAt = -1;
let selected = null;
let inside = false;
let visible = false;
let frame = 0;
let last = 0;
let clock = 0;
let touring = !still.matches;
let tourClock = 0;
let idleTimer = 0;
let leaveTimer = 0;
let lastVT = "";
let shownRods = "";
let shownCursor = "";

const heat = { x: 1, v: 0 };
const rodE = { x: 0, v: 0 };
const first = { x: 0, v: 0 };

function say(text) { if (readout.textContent !== text) readout.textContent = text; }
// live hover for the core: separates fission power, decay heat and the heat glow.
// No fuel temperature is claimed — the glow is a relative heat-intensity cue.
function coreSay(t) {
  if (t <= 0) return "fuel assemblies · at power: fission 93.4 % + decay 6.6 % of full power · glow = remaining heat";
  return `fuel assemblies · fission ${(fissionFrac(t) * 100).toFixed(2)} % (chain reaction suppressed) · decay heat ${(decayFrac(t) * 100).toFixed(1)} % · glow tracks the remaining heat`;
}
function reset() {
  playing = false;
  t = 0;
  scramAt = -1;
  slider.value = "0";
  run();
}
function scram() {
  if (t > 0) { reset(); return; }
  playing = true;
  scramAt = clock;
  run();
}

// ---------------------------------------------------------------- per-frame draw
function draw() {
  const rod = rodFrac(t);
  const total = totalFrac(t);
  const drop = -D.rodStroke * rodE.x;
  const rodsKey = drop.toFixed(2);
  if (rodsKey !== shownRods) {
    shownRods = rodsKey;
    rodsEl.setAttribute("transform", translateAlong(PROJ, [0, 0, drop]));
    holdStill(rodsEl, [D.EZ[0] * drop, D.EZ[1] * drop]);
  }
  const cx = (t * (320 / 60)).toFixed(2);
  if (cx !== shownCursor) {
    shownCursor = cx;
    cursorEl.setAttribute("transform", translateAlong(PROJ, [t * (320 / 60), 0, 0]));
  }
  needleEls.power.setAttribute("d", needleAt("power", total * 100));
  needleEls.temp.setAttribute("d", needleAt("temp", outletC(t)));
  const zSpan = BAR_Z[1] - BAR_Z[0];
  const fh = zSpan * clamp(fissionFrac(t), 0, 1);
  const dh = zSpan * clamp((decayFrac(t) * 100) / 8, 0, 1);
  barEls.fission.setAttribute("height", fh.toFixed(2));
  barEls.fission.setAttribute("y", (-BAR_Z[0] - fh).toFixed(2));
  barEls.decay.setAttribute("height", dh.toFixed(2));
  barEls.decay.setAttribute("y", (-BAR_Z[0] - dh).toFixed(2));
  const press = scramAt >= 0 ? burst(clock - scramAt, 0.06, 0.22) : 0;
  scramEl.setAttribute("transform", translateAlong(PROJ, [0, 0, -2.2 * press]));
  stage.style.setProperty("--rx-heat", heat.x.toFixed(3));
  if (!selected) say(readoutOf(t));
  else if (selected === "core") say(coreSay(t));
  stage.setAttribute("aria-valuenow", String(Math.round(t)));
  const vt = phaseOf(t) === "ready" ? "ready, rods up, at power, core outlet 325 degrees" : `${phaseOf(t)}, t ${t.toFixed(0)} seconds, decay heat ${(decayFrac(t) * 100).toFixed(1)} percent, core outlet ${outletC(t).toFixed(0)} degrees celsius`;
  if (vt !== lastVT) { lastVT = vt; stage.setAttribute("aria-valuetext", vt); }
  if (layer) {
    const active = heat.x > 0.004 || first.x < 0.999;
    if (active) layer.draw({ uHeat: heat.x, uFirst: first.x }, still.matches ? 0.8 : clock);
    else layer.clear();
  }
}

// ---------------------------------------------------------------- loop
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    if (t === 0 && !playing && tourClock > 1.6) { scram(); tourClock = 0; }
    else if (playing && t >= 26) { playing = false; tourClock = 0; }
    else if (t >= 26 && !playing && tourClock > 2.4) { reset(); tourClock = 0; }
    else if (t === 0 && !playing && tourClock > 3.4) { tourClock = 0; }
  }
  if (playing) {
    t = Math.min(60, t + dt * 3);
    slider.value = String(t);
    if (t >= 60) playing = false;
  }
  settle(heat, totalFrac(t), dt, 0.5, calm);
  settle(rodE, rodFrac(t), dt, 0.18, calm);
  settle(first, visible ? 1 : 0, dt, 0.7, calm);
  draw();
  const pressDone = scramAt < 0 || clock - scramAt > 1.2;
  const settled = !playing && !touring && Math.abs(heat.x - totalFrac(t)) < 1e-4 && Math.abs(rodE.x - rodFrac(t)) < 1e-4 && pressDone;
  frame = visible && (!settled || (layer && first.x < 0.999)) ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

// ---------------------------------------------------------------- interaction
function quietTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (inside || playing || t > 0) { quietTour(); return; }
    touring = !still.matches;
    tourClock = 0;
    run();
  }, 3600);
}
function pieceAt(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it") : null;
  return item ? item.dataset.piece : null;
}
function select(id) {
  if (selected === id) return;
  selected = id;
  for (const node of stage.querySelectorAll(".it")) {
    if (id && node.dataset.piece === id) node.setAttribute("data-on", "");
    else node.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  say(id ? (D.pieces[id] ? D.pieces[id].say : readoutOf(t)) : readoutOf(t));
}
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  inside = true;
  clearTimeout(leaveTimer);
  quietTour();
  select(pieceAt(event));
  run();
});
stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => { if (!inside) select(null); }, 260);
});
stage.addEventListener("pointerdown", (event) => {
  quietTour();
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  if (hit && hit.closest && hit.closest('[data-live="scram"]')) { scram(); return; }
  if (event.pointerType === "touch") {
    const id = pieceAt(event);
    if (id) { select(id); run(); }
  }
});
slider.addEventListener("input", () => {
  quietTour();
  playing = false;
  t = clamp(parseFloat(slider.value) || 0, 0, 60);
  run();
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    quietTour();
    scram();
    return;
  }
  if (event.key === "Escape") { event.preventDefault(); quietTour(); reset(); return; }
  let next = null;
  const step = event.shiftKey ? 5 : 1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") next = clamp(t + step, 0, 60);
  else if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = clamp(t - step, 0, 60);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = 60;
  if (next === null) return;
  event.preventDefault();
  quietTour();
  playing = false;
  t = next;
  slider.value = String(next);
  run();
});
window.addEventListener("resize", () => run());
</script></body></html>
